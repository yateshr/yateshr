name: Refresh contribution graph

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-profile-graph.py
      - .github/workflows/profile-graph.yml

permissions:
  contents: write

concurrency:
  group: profile-contribution-graph
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contribution graphic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-profile-graph.py
      - name: Save updated graphic
        run: |
          if git diff --quiet -- assets/contribution-graph.svg; then
            echo "Contribution graphic is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          git commit -m "Refresh contribution activity graphic"
          git push
